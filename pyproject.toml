[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baanmitra"
version = "1.0.0"
description = "BaanMitra - the last mile of India's flood early warning system. Free-tier voice agent for Hackyard Build 2026 (IIT Guwahati)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MyBeerZ9" }]
keywords = ["flood", "early-warning", "voice-agent", "assam", "twilio", "groq", "supabase"]

# Keep in sync with requirements.txt (requirements.txt stays the source of truth
# for setup.ps1; this list exists so `pip install -e .` is enough on its own).
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "twilio>=9.0",
    "gTTS>=2.5",
    "python-multipart>=0.0.9",
    "feedparser>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
