# BaanMitra free 15-minute ingest cron (GitHub Actions).
# Public repositories get unlimited Actions minutes, so this costs Rs 0.
#
# TWO MODES, picked automatically from the repository secrets:
#
#   DEPLOYED  (secret BAANMITRA_URL is set)
#       pings the Render free service and asks it to run one LIVE cycle.
#       This is the only path that can place a real phone call.
#
#   RUNNER    (secret BAANMITRA_URL is NOT set - the default)
#       runs the offline smoke tests and a DRY-RUN cycle on the GitHub-hosted
#       runner. --dry-run is forced here, so CI can NEVER dial anybody, even
#       if Twilio secrets are added later.
#
# Configure under Settings -> Secrets and variables -> Actions:
#   BAANMITRA_URL        e.g. https://baanmitra-xxxx.onrender.com (deploy first)
#   CRON_TOKEN           must equal the CRON_TOKEN in the service's .env
#   GROQ_API_KEY         optional - gives the runner-mode cycle LLM scripts
#   DATABASE_URL         optional - Supabase session-pooler string
#   TWILIO_* / CONSENTED_NUMBERS / BHASHINI_*  optional, live mode only
name: baanmitra-ingest

on:
  schedule:
    - cron: "*/15 * * * *"      # every 15 minutes, monsoon season
  workflow_dispatch:            # manual runs from the Actions tab

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # presence of this secret selects the mode
      BAANMITRA_URL: ${{ secrets.BAANMITRA_URL }}
      CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
      # optional keys for runner mode (never enough to place a call)
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        if: env.BAANMITRA_URL == ''
        uses: actions/checkout@v4

      - name: Set up Python (free)
        if: env.BAANMITRA_URL == ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install free dependencies
        if: env.BAANMITRA_URL == ''
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
          python -m pip install --quiet -e .

      - name: Run one flood-alert cycle
        run: |
          set -euo pipefail
          if [ -n "${BAANMITRA_URL:-}" ]; then
            echo "== deployed mode: ${BAANMITRA_URL} =="
            curl -fsS --max-time 120 "${BAANMITRA_URL}/healthz" \
              || echo "::warning::service cold-starting (free tier sleeps), continuing anyway"
            if [ -n "${CRON_TOKEN:-}" ]; then
              curl -fsS --max-time 300 -X POST "${BAANMITRA_URL}/cron/ingest?token=${CRON_TOKEN}"
            else
              curl -fsS --max-time 300 -X POST "${BAANMITRA_URL}/cron/ingest"
            fi
            echo
          else
            echo "== runner mode: BAANMITRA_URL secret is not set =="
            {
              echo "## BaanMitra ingest - runner mode (dry-run, no calls placed)"
              echo ""
              echo '```'
              python smoke_test.py
              echo '```'
              echo '```'
              python -m baanmitra.agents.watchdog --dry-run
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
